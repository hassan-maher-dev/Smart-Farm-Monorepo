name: plant_monitor

description: A Flutter application for Smart Farm monitoring

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# ===================================================
# ================= DEPENDENCIES =====================
# ===================================================

dependencies:

  flutter:
    sdk: flutter

  # ================= HTTP APIs =================

  http: ^1.1.0

  # ================= Local Storage =================

  shared_preferences: ^2.5.5

  # ================= AI / Images =================

  image_picker: ^1.0.4

  tflite_flutter: ^0.11.0

  image: ^4.1.3

  cached_network_image: ^3.3.0

  path_provider: ^2.1.2

  # ================= Charts =================

  fl_chart: ^1.2.0

  # ================= Utilities =================

  intl: ^0.18.1

  share_plus: ^12.0.1

# ===================================================
# ================= DEV DEPENDENCIES ================
# ===================================================

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1

# ===================================================
# ================= FLUTTER CONFIG ==================
# ===================================================

flutter:

  uses-material-design: true

  assets:

    - assets/icon/

    - assets/diseases/

    - assets/tflite/

# ===================================================
# ================= APP ICON ========================
# ===================================================

flutter_launcher_icons:

  android: "launcher_icon"

  ios: true

  image_path: "assets/icon/app_icon.png"

  min_sdk_android: 21

  # Android Adaptive Icon
  adaptive_icon_background: "#4CAF50"

  adaptive_icon_foreground:
    "assets/icon/app_icon.png"

  # Web
  web:

    generate: true

    image_path:
      "assets/icon/app_icon.png"

    background_color: "#4CAF50"

    theme_color: "#4CAF50"

  # Windows
  windows:

    generate: true

    image_path:
      "assets/icon/app_icon.png"

    icon_size: 48